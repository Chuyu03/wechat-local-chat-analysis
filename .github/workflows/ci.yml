name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Python ${{ matrix.python-version }} offline tests
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and tests
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m compileall -q src tests

      - name: Run synthetic offline tests
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m unittest discover -s tests -v

      - name: Check CLI help
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m wechat_analyse --help

      - name: Run local diagnostics
        env:
          PYTHONPATH: ${{ github.workspace }}\src
          LOCALAPPDATA: ${{ runner.temp }}\LocalAppData
        run: python -m wechat_analyse --workspace "${{ runner.temp }}\WechatLocalChatAnalysis" doctor
